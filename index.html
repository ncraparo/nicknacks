<style>
  :root {
    --black: #000;
    --white: #fff;
    --gray: #a1a1a1;
    --blue: #3e3cb4;
    --red: #e0261d;
    --red-dark: #8f1410;
    --red-light: #ff7a6e;

    --font: "Pixelify Sans", ui-monospace, "SF Mono", Menlo, "Courier New", monospace;

    /* bobblehead size: the frame art is 645 x 1145 */
    --h: min(44vh, 440px);
    --w: calc(var(--h) * 0.5633);

    /* one pixel of the speech bubble art, in screen pixels */
    --px: 3px;
  }
  @supports (height: 1dvh) {
    :root { --h: min(44dvh, 440px); }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--black);
    color: var(--white);
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding:
      max(20px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    font-family: var(--font);
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  /* ---------- title ---------- */
  h1 {
    margin: 0 0 clamp(26px, 5vh, 44px);
    font-family: var(--font);
    font-weight: 700;
    font-size: clamp(40px, 13vw, 72px);
    line-height: 1;
    letter-spacing: 0.01em;
    text-align: center;
    color: var(--white);
    text-shadow: 4px 4px 0 var(--blue);
  }

  /* ---------- bobblehead ---------- */
  .bobble {
    position: relative;
    width: var(--w);
    height: var(--h);
    flex: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .frame.on { opacity: 1; }

  /* ---------- speech bubble ---------- */
  .bubble {
    --bmax: min(230px, calc(50vw - var(--w) * 0.12 - 14px));
    position: absolute;
    left: 62%;
    bottom: 72%;
    z-index: 2;
    min-width: calc(28 * var(--px) + 12px);
    width: max-content;
    max-width: var(--bmax);
    /* art is 6 px of corner on top and 17 px of body edge plus tail on the bottom */
    min-height: calc(var(--px) * 23);
    padding:
      calc(var(--px) + 9px)
      14px
      calc(var(--px) * 11 + 8px)
      14px;
    color: #111;
    pointer-events: none;
    transform-origin: 18% 100%;
  }
  .bubble::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-style: solid;
    border-width:
      calc(var(--px) * 6)
      calc(var(--px) * 6)
      calc(var(--px) * 17)
      calc(var(--px) * 22);
    border-image-source: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADYAAAArCAYAAAAzDXuYAAAA5UlEQVR42u3ZwQqEMAwE0Ikfqt9WfzR7sVKyVWplu02YgVxED49RWqqgHoWfSOtFBQBVHzYRqVosTL2ALoCnZ4mAKt4wtTDXqBpuQdBIlLbs9xa2McIII4wwwggjjDDCCCOMMMIII6wZtu97GFC25ANGTSkBANZ1dQ3atg0AZLm6wSOqTHnEfbbmpTkLym1Z2BeuF/iP1ktUDQYcR8S9wNGoA3RlqeLOSSlpS+xzg+bROibFNDVR/MYZPb9boO2/qRA7jxlRr2Gzol7BZkZ1w2ZHdcE8oB7DvKAeweyWJUJuV/hZ8wFJHY2wKU9w0AAAAABJRU5ErkJggg==");
    border-image-slice: 6 6 17 22 fill;
    border-image-width:
      calc(var(--px) * 6)
      calc(var(--px) * 6)
      calc(var(--px) * 17)
      calc(var(--px) * 22);
    border-image-repeat: stretch;
    image-rendering: pixelated;
  }
  .bubble[hidden] { display: none; }
  .bubble.pop { animation: pop 0.2s steps(4) both; }
  @keyframes pop {
    from { transform: scale(0.6); opacity: 0.2; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .dots {
    display: flex;
    align-items: flex-end;
    gap: 9px;
    height: 22px;
    padding-left: 2px;
  }
  .dots i {
    display: block;
    width: 6px;
    height: 6px;
    margin-bottom: 4px;
    background: #111;
  }
  .said {
    margin: 0;
    min-height: 22px;
    font-size: 15px;
    line-height: 1.25;
    font-weight: 500;
    overflow-wrap: break-word;
  }
  .bubble[data-state="thinking"] .said { display: none; }
  .bubble[data-state="answer"] .dots { display: none; }

  /* ---------- question box and Ask button ---------- */
  .form {
    margin-top: clamp(18px, 3.5vh, 30px);
    width: min(82vw, 340px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(12px, 2vh, 18px);
  }

  .box {
    width: 100%;
    height: 50px;
    padding: 0 14px;
    border: 3px solid var(--white);
    border-radius: 0;
    background: var(--white);
    box-shadow: inset -4px -4px 0 var(--gray);
    color: #000;
    caret-color: var(--red);
    font-family: var(--font);
    font-size: 18px; /* 16px or more keeps iOS from zooming in on focus */
    font-weight: 500;
    appearance: none;
    -webkit-appearance: none;
  }
  .box::placeholder { color: #8a8a8a; opacity: 1; }
  .box:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
  .box.shake { animation: shake 0.32s steps(2) 1; border-color: var(--red); }
  @keyframes shake {
    0%   { transform: translateX(0); }
    25%  { transform: translateX(-6px); }
    50%  { transform: translateX(6px); }
    75%  { transform: translateX(-4px); }
    100% { transform: translateX(0); }
  }

  .ask {
    width: 116px;
    height: 44px;
    border: 0;
    border-radius: 0;
    background: var(--red);
    box-shadow:
      inset 3px 3px 0 var(--red-light),
      inset -4px -4px 0 var(--red-dark);
    color: var(--white);
    font-family: var(--font);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    touch-action: manipulation;
  }
  .ask:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow:
      inset 3px 3px 0 var(--red-dark),
      inset -3px -3px 0 var(--red-light);
  }
  .ask:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
  .ask:disabled { cursor: default; filter: saturate(0.55) brightness(0.8); }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (min-width: 720px) {
    .bubble { left: 80%; }
    :root { --px: 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bubble.pop, .box.shake { animation: none; }
  }
</style>
</head>

  <div class="bubble" id="bubble" data-state="thinking" aria-hidden="true" hidden>
    <div class="dots" id="dots"><i></i><i></i><i></i></div>
    <p class="said" id="said"></p>
  </div>
</div>

<div class="form">
  <input class="box" id="question" type="text" inputmode="text" maxlength="140"
         autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="go"
         placeholder="Ask the bobblehead" aria-label="Your question">
  <button class="ask" id="ask" type="button">Ask</button>
</div>

<div class="sr" id="sr" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var ANSWERS = [
    "It is certain.", "It is decidedly so.", "Without a doubt.", "Yes, definitely.",
    "You may rely on it.", "As I see it, yes.", "Most likely.", "Outlook good.",
    "Yes.", "Signs point to yes.",
    "Reply hazy, try again.", "Ask again later.", "Better not tell you now.",
    "Cannot predict now.", "Concentrate and ask again.",
    "Don't count on it.", "My reply is no.", "My sources say no.",
    "Outlook not so good.", "Very doubtful."
  ];

  var STEP_MS   = 300;   // one step of the ". . ." animation
  var DOT_STEPS = 4;     // [   ] -> [.  ] -> [. .] -> [. . .]
  var FRAME_MS  = 105;   // time each bobble frame stays on screen
  var BOBBLE_SEQ = ["a1", "a2", "a3", "a0", "a2", "a1", "a3", "a0"];
  var SETTLE = [["a2", 150], ["a1", 200], ["a3", 260], ["idle", 0]];

  var reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var frames = {};
  Array.prototype.forEach.call(document.querySelectorAll(".frame"), function (img) {
    frames[img.getAttribute("data-frame")] = img;
    if (img.decode) { img.decode().catch(function () {}); }
  });

  var bubble = document.getElementById("bubble");
  var dots   = document.getElementById("dots").children;
  var said   = document.getElementById("said");
  var input  = document.getElementById("question");
  var button = document.getElementById("ask");
  var sr     = document.getElementById("sr");

  var current = "idle";
  var timer = null;
  var busy = false;
  var lastAnswer = -1;

  function show(key) {
    if (key === current) { return; }
    frames[current].classList.remove("on");
    frames[key].classList.add("on");
    current = key;
  }

  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function startBobble() {
    if (reduceMotion) { return; }
    var i = 0;
    (function tick() {
      show(BOBBLE_SEQ[i % BOBBLE_SEQ.length]);
      i += 1;
      timer = setTimeout(tick, FRAME_MS);
    })();
  }

  function stopBobble() {
    clearTimeout(timer);
    if (reduceMotion) { show("idle"); return Promise.resolve(); }
    var chain = Promise.resolve();
    SETTLE.forEach(function (step) {
      chain = chain.then(function () {
        show(step[0]);
        return step[1] ? sleep(step[1]) : null;
      });
    });
    return chain;
  }

  function setDots(n) {
    for (var i = 0; i < dots.length; i++) {
      dots[i].style.visibility = i < n ? "visible" : "hidden";
    }
  }

  function openBubble(state) {
    bubble.setAttribute("data-state", state);
    if (bubble.hidden) {
      bubble.hidden = false;
      bubble.classList.remove("pop");
      void bubble.offsetWidth;
      bubble.classList.add("pop");
    }
  }

  function pickAnswer() {
    var i;
    do { i = Math.floor(Math.random() * ANSWERS.length); } while (i === lastAnswer);
    lastAnswer = i;
    return ANSWERS[i];
  }

  function nudge() {
    input.classList.remove("shake");
    void input.offsetWidth;
    input.classList.add("shake");
    input.focus();
  }

  async function ask() {
    if (busy) { return; }
    if (!input.value.trim()) { nudge(); return; }

    busy = true;
    button.disabled = true;
    input.blur();
    bubble.hidden = true;
    sr.textContent = "Thinking";

    setDots(0);
    openBubble("thinking");
    startBobble();

    var loops = 2 + Math.floor(Math.random() * 2); // 2 or 3 times through
    for (var l = 0; l < loops; l++) {
      for (var s = 0; s < DOT_STEPS; s++) {
        setDots(s);
        await sleep(STEP_MS);
      }
    }

    await stopBobble();

    var answer = pickAnswer();
    said.textContent = answer;
    bubble.setAttribute("data-state", "answer");
    bubble.classList.remove("pop");
    void bubble.offsetWidth;
    bubble.classList.add("pop");
    sr.textContent = answer;

    button.disabled = false;
    busy = false;
  }

  button.addEventListener("click", ask);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); ask(); }
  });
  input.addEventListener("animationend", function () { input.classList.remove("shake"); });
})();
</script>
